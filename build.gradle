plugins {
    id 'java'
    id 'war'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'edu.mssm.pharm.maayanlab.G2N'
description = 'G2N'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

configurations.configureEach {
    // log4j 1.x is EOL and vulnerable; logging is routed through slf4j-jdk14 instead
    exclude group: 'log4j', module: 'log4j'
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
}

dependencies {
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'

    implementation 'com.github.MaayanLab:Genes2Networks:master'
    implementation 'com.github.MaayanLab.common:common-swing:master-SNAPSHOT'
    implementation 'com.github.MaayanLab.common:common-graph:master-SNAPSHOT'
    implementation 'com.github.MaayanLab.common:common-core:master-SNAPSHOT'
    implementation 'com.github.MaayanLab.common:common-web:master-SNAPSHOT'
    implementation 'com.github.MaayanLab.common:common-geneticalgorithm:master-SNAPSHOT'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    runtimeOnly 'org.slf4j:slf4j-jdk14:2.0.17'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    testImplementation 'javax.servlet:javax.servlet-api:4.0.1'
}

def webappDir = file("${projectDir}/src/main/webapp")

node {
    download = true
    version = '22.17.0'
    nodeProjectDir = webappDir
}

tasks.register('buildProject', NpmTask) {
    dependsOn tasks.named('npmInstall')
    inputs.file("${webappDir}/.babelrc")
    inputs.file("${webappDir}/gruntfile.js")
    inputs.files fileTree(webappDir).include('**/*.js').include('**/*.css').exclude('dist/**').exclude('node_modules/**')
    outputs.dir("${webappDir}/dist")
    args = ['run', 'build']
}

tasks.named('war') {
    dependsOn tasks.named('buildProject')
    // build tooling only, not needed at runtime
    exclude 'node_modules/**', 'package.json', 'package-lock.json', 'gruntfile.js', '.babelrc', 'resources/*.jsx'
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}
